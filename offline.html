<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>You're offline – demomq</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      margin: 0;
      background: #f8f8f8;
      color: #131313;
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p  { color: #505050; max-width: 36ch; }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #3b63fb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>You're offline</h1>
  <p>No internet connection detected. Reconnect and try again, or browse pages you've already visited.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
